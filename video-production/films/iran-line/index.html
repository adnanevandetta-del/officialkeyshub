GCAM = track(GKEYS.map(([t, v]) => [t, v || mapToGlobe(t)]));

window.DUR = T1 - T0;
window.render = t => frame(t + T0);
window.TEXTS = t => { window.render(t); return TX.map(o => ({ ...o })); };
// cue events for the mixer (film time)
const EVF = [
  { t: .3, type: 'point' }, { t: 1.2, type: 'title' }, { t: 5.33, type: 'ignite' }, { t: 8.6, type: 'close' }, { t: 9.0, type: 'measure' },
  ...BASE_T.map((t, i) => ({ t, type: 'base', i })), { t: 16.0, type: 'turn' }, { t: 18.0, type: 'path', i: 0 }, { t: 18.7, type: 'path', i: 1 },
  { t: 18.4, type: 'dg' }, { t: 22.6, type: 'measure' }, { t: 26.0, type: 'fail' }, { t: 27.3, type: 'intercept' }, { t: 28.6, type: 'tick' },
  { t: 31.33, type: 'silence' }, { t: 32.0, type: 'break' }, ...segs.map(S => ({ t: 32.0 + S.rnd * 2.4, type: 'seg' })), { t: 35.2, type: 'rise' }, { t: 37.33, type: 'dissolve' },
  { t: 38.67, type: 'ruler' }, { t: 42.0, type: 'dc' }, { t: 45.0, type: 'tick' }, { t: 50.5, type: 'year' }, { t: 56.67, type: 'final' }, { t: 59.4, type: 'end' }];
window.EV = EVF.map(e => ({ ...e, t: e.t - T0 })).filter(e => e.t >= 0 && e.t <= T1 - T0);
window.render(0);
window.READY = true;
</script>
