name: Auto Blog

# On demand only (no schedule): run it from the Actions tab to draft one SEO
# article from the next queued keyword. It opens a PR for review — nothing is
# published until the PR is merged and the site is deployed.

on:
  workflow_dispatch: {} # manual runs only, from the Actions tab

permissions:
  contents: write
  pull-requests: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Generate article draft
        id: gen
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Optional override, e.g. claude-opus-5 for higher quality:
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}
        run: node scripts/generate-article.mjs

      - name: Open pull request
        if: steps.gen.outputs.generated == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          branch: auto-blog/${{ steps.gen.outputs.slug }}
          add-paths: content/blog/**
          commit-message: "blog: ${{ steps.gen.outputs.title }}"
          title: "blog: ${{ steps.gen.outputs.title }}"
          body: |
            Automated draft article generated from the keyword queue.

            - **Slug:** `${{ steps.gen.outputs.slug }}`
            - **File:** `content/blog/${{ steps.gen.outputs.slug }}.mdx`

            **Preview before publishing:** read it in the "Files changed" tab, or
            ask for a local preview of `/blog/${{ steps.gen.outputs.slug }}`.
            Edit the MDX if needed, then **merge to approve** — it goes live on
            `/blog` and in the sitemap with the next deploy. To reject it, close
            the PR (or set `draft: true` in the frontmatter to keep it hidden).

            🤖 Generated with [Claude Code](https://claude.com/claude-code)
          labels: auto-blog
          delete-branch: true
